name: CI - Test FHIR Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test data generation
      run: |
        python src/generator/generate_patients.py 100 data/raw/test_patients.csv
    
    - name: Test FHIR transformation
      run: |
        python src/transformer/csv_to_fhir.py data/raw/test_patients.csv data/transformed/test
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: test-data
        path: data/transformed/test/
